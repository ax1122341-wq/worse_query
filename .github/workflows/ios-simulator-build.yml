name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches:
      - ios-security-lab
    paths:
      - 'ios-security-lab/**'
      - '.github/workflows/ios-simulator-build.yml'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        working-directory: ios-security-lab
        run: xcodebuild -list -project IOSSecurityLab.xcodeproj

      - name: Build authorized App Group test apps for iOS Simulator
        working-directory: ios-security-lab
        run: |
          xcodebuild \
            -project IOSSecurityLab.xcodeproj \
            -scheme IOSSecurityLab \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator build outputs
        if: success()
        working-directory: ios-security-lab
        run: |
          mkdir -p "$RUNNER_TEMP/ios-simulator-builds"
          for target in WriterApp VerifierApp; do
            xcodebuild \
              -project IOSSecurityLab.xcodeproj \
              -target "$target" \
              -destination 'generic/platform=iOS Simulator' \
              CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/PackageProducts-$target" \
              OBJROOT="$RUNNER_TEMP/PackageIntermediates-$target" \
              CODE_SIGNING_ALLOWED=NO \
              build
            ditto "$RUNNER_TEMP/PackageProducts-$target/$target.app" "$RUNNER_TEMP/ios-simulator-builds/$target.app"
          done
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ios-simulator-builds" "$RUNNER_TEMP/ios-simulator-builds.zip"

      - name: Build for physical iOS devices (unsigned validation)
        working-directory: ios-security-lab
        run: |
          xcodebuild \
            -project IOSSecurityLab.xcodeproj \
            -scheme IOSSecurityLab \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests on iPhone Simulator
        working-directory: ios-security-lab
        run: |
          xcodebuild \
            -project IOSSecurityLab.xcodeproj \
            -scheme IOSSecurityLab \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/IOSSecurityLabTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload simulator build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-builds
          path: ${{ runner.temp }}/ios-simulator-builds.zip
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-security-lab-test-results
          path: ${{ runner.temp }}/IOSSecurityLabTests.xcresult
          retention-days: 7
