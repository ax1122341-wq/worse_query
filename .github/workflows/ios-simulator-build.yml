name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches:
      - ios-security-lab
      - supabase-integration
    paths:
      - 'ios-security-lab/**'
      - '.github/workflows/ios-simulator-build.yml'
  pull_request:
    branches:
      - supabase-integration
    paths:
      - 'ios-security-lab/**'
      - '.github/workflows/ios-simulator-build.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        working-directory: ios-security-lab
        run: xcodebuild -list -project IOSSecurityLab.xcodeproj

      - name: Build authorized App Group test apps for iOS Simulator
        working-directory: ios-security-lab
        run: |
          xcodebuild \
            -project IOSSecurityLab.xcodeproj \
            -scheme IOSSecurityLab \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator build outputs
        if: success()
        working-directory: ios-security-lab
        run: |
          mkdir -p "$RUNNER_TEMP/ios-simulator-builds"
          for target in WriterApp VerifierApp; do
            xcodebuild \
              -project IOSSecurityLab.xcodeproj \
              -target "$target" \
              -destination 'generic/platform=iOS Simulator' \
              CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/PackageProducts-$target" \
              OBJROOT="$RUNNER_TEMP/PackageIntermediates-$target" \
              CODE_SIGNING_ALLOWED=NO \
              build
            ditto "$RUNNER_TEMP/PackageProducts-$target/$target.app" "$RUNNER_TEMP/ios-simulator-builds/$target.app"
          done
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ios-simulator-builds" "$RUNNER_TEMP/ios-simulator-builds.zip"

      - name: Upload simulator build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-builds
          path: ${{ runner.temp }}/ios-simulator-builds.zip
          retention-days: 7
          if-no-files-found: error

      - name: Build for physical iOS devices (unsigned validation)
        working-directory: ios-security-lab
        run: |
          xcodebuild \
            -project IOSSecurityLab.xcodeproj \
            -scheme IOSSecurityLab \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build and package unsigned iPhone app bundles
        if: success()
        working-directory: ios-security-lab
        run: |
          mkdir -p "$RUNNER_TEMP/ios-device-ipas"
          for target in WriterApp VerifierApp; do
            xcodebuild \
              -project IOSSecurityLab.xcodeproj \
              -target "$target" \
              -destination 'generic/platform=iOS' \
              CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/DeviceProducts-$target" \
              OBJROOT="$RUNNER_TEMP/DeviceIntermediates-$target" \
              CODE_SIGNING_ALLOWED=NO \
              build
            APP_PATH="$RUNNER_TEMP/DeviceProducts-$target/$target.app"
            IPA_ROOT="$RUNNER_TEMP/ipa-$target"
            mkdir -p "$IPA_ROOT/Payload"
            ditto "$APP_PATH" "$IPA_ROOT/Payload/$target.app"
            (
              cd "$IPA_ROOT"
              ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/ios-device-ipas/$target-unsigned.ipa"
            )
          done

      - name: Upload unsigned iPhone IPA packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-unsigned-ipas
          path: ${{ runner.temp }}/ios-device-ipas/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Run unit tests on iPhone Simulator
        timeout-minutes: 12
        working-directory: ios-security-lab
        run: |
          xcodebuild \
            -project IOSSecurityLab.xcodeproj \
            -scheme IOSSecurityLab \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/IOSSecurityLabTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-security-lab-test-results
          path: ${{ runner.temp }}/IOSSecurityLabTests.xcresult
          retention-days: 7

      - name: Publish iOS build status to the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          if [ "$BUILD_RESULT" = "success" ]; then
            STATE="success"
            DESCRIPTION="iOS build and simulator tests passed"
          elif [ "$BUILD_RESULT" = "cancelled" ]; then
            STATE="error"
            DESCRIPTION="iOS build was cancelled"
          else
            STATE="failure"
            DESCRIPTION="iOS build or simulator tests failed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context="iOS Simulator Build" \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
